services:
  # MongoDB — база данных для Rocket.Chat
  db:
    image: mongodb/mongodb-community-server:${MONGODB_VERSION:-8.0}-ubi8
    platform: linux/amd64
    container_name: rocketchat-mongo
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
      - mongodb_dump:/dump
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=rocketchat
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Инициализация репликасета
  db-init:
    image: mongodb/mongodb-community-server:${MONGODB_VERSION:-8.0}-ubi8
    platform: linux/amd64
    container_name: rocketchat-mongo-init
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: >
      mongosh --host db:27017 --eval '
        try {
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "db:27017" }]
          });
          print("Replica set initialized");
        } catch (e) {
          print("Replica set may already be initialized: " + e);
        }
      '
    healthcheck:
      test: mongosh --host db:27017 --quiet --eval 'rs.status().ok === 1'
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Rocket.Chat
  rocketchat:
    image: rocketchat/rocket.chat:${ROCKETCHAT_VERSION:-8.1.1} 
    platform: linux/amd64
    container_name: rocketchat-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TEST_MODE=true
      - PORT=3000
      - MONGO_URL=mongodb://db:27017/rocketchat?replicaSet=rs0
      - MAX_FILE_SIZE=10485760
      - LOG_LEVEL=info
      - DEPLOY_METHOD=docker
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:3000/api/info || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - rocketchat_uploads:/app/uploads

volumes:
  mongodb_data:
  mongodb_dump:
  rocketchat_uploads: